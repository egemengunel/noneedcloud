  <title id="title">NoNeedCloud logolu yükleme göstergesi</title>
  <desc id="description">Logo sabit kalırken altındaki çizgi tekrar tekrar kayar.</desc>
  <style>
    .word { fill: #121b2d; }
    .cloud { fill: #2457c6; }
    .track { fill: #dfe8fa; }
    .sweep {
      fill: #2457c6;
      animation: sweep 1.68s linear infinite;
    }
    @keyframes sweep {
      from { transform: translateX(-320px); }
      to { transform: translateX(0); }
    }
    @media (prefers-color-scheme: dark) {
      .word { fill: #f3f6ff; }
      .cloud, .sweep { fill: #a6c4ff; }
      .track { fill: #3b527d; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; transform: translateX(104px); }
    }
  </style>
