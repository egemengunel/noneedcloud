<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title description">
  <title id="title">NoNeedCloud bulut animasyonu</title>
  <desc id="description">Bulutun dış çizgisi belirir. Çevresindeki iki çizgi kısa bir hareketten sonra durur.</desc>
  <style>
    .field { fill: #e2edff; }
    .orbit { fill: none; stroke: #5f90ef; }
    .track { stroke-opacity: .28; }
    .arc { stroke-linecap: round; transform-origin: 260px 180px; }
    .inner { animation: inner-in 1.12s .04s cubic-bezier(.18,.7,.24,1) both; }
    .outer { animation: outer-in 1.18s .12s cubic-bezier(.18,.7,.24,1) both; }
    .mark { transform-box: fill-box; transform-origin: center; animation: mark-in 1.24s cubic-bezier(.24,.65,.27,1) both; }
    .base { fill: #9bb7ed; }
    .color { fill: url(#cloud-blue); }
    .reveal { transform-box: fill-box; transform-origin: left; animation: trace-in .96s .16s cubic-bezier(.24,.65,.27,1) both; }
    @keyframes trace-in {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes mark-in {
      from { opacity: 0; transform: translateY(16px) scale(.88); }
      32% { opacity: 1; }
      to { opacity: 1; transform: none; }
    }
    @keyframes inner-in {
      from { opacity: 0; transform: rotate(-106deg); }
      38% { opacity: .8; }
      to { opacity: .86; transform: rotate(-58deg); }
    }
    @keyframes outer-in {
      from { opacity: 0; transform: rotate(154deg); }
      44% { opacity: .54; }
      to { opacity: .58; transform: rotate(112deg); }
    }
    .inner { opacity: .86; transform: rotate(-58deg); }
    .outer { opacity: .58; transform: rotate(112deg); }
    @media (prefers-color-scheme: dark) {
      .field { fill: #1f3154; }
      .orbit { stroke: #8fb5ff; }
      .base { fill: #7295d5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .mark, .inner, .outer { animation: none; }
    }
  </style>
  <defs>
    <path id="cloud" d="M330.684 6.08139C445.78 -18.2787 543.738 31.7876 598.493 133.993C749.466 115.279 846.617 278.52 762.469 398.333C744.976 423.301 721.104 443.107 693.342 455.68C661.594 469.99 607.955 477.156 571.573 483.591L433.758 507.859L287.225 534.085C255.561 539.727 207.781 550.097 177.669 548.849C148.376 547.426 119.809 539.12 94.3293 524.602C50.8236 500.029 19.0905 458.941 6.30521 410.65C-6.39819 363.565 0.261474 313.359 24.7681 271.205C54.7177 219.392 95.9803 194.671 152.012 179.822C175.717 87.7711 241.693 31.3352 330.684 6.08139ZM421.005 427.749L567.538 401.648C589.702 397.731 637.955 390.541 656.782 382.522C671.564 376.281 684.226 365.926 693.286 352.684C706.677 332.995 711.596 308.746 706.912 285.4C702.618 262.281 689.233 241.849 669.745 228.693C628.954 201.595 585.326 217.85 545.325 236.256C534.31 182.81 516.958 139.383 469.088 107.975C434.018 84.5357 390.941 76.3576 349.733 85.3253C347.632 85.7676 345.534 86.2247 343.46 86.6928C267.559 110.074 220.048 180.66 228.8 259.952C189.145 256.101 153.655 255.119 120.748 282.251C99.6305 299.764 86.3897 325.001 83.9971 352.329C81.5154 380.512 90.7071 410.648 109.149 432.207C126.62 452.336 151.283 464.816 177.85 466.964C204.594 469.01 259.648 456.893 288.5 451.61C332.614 443.435 376.79 435.48 421.005 427.749Z"/>
    <linearGradient id="cloud-blue" x1="5%" y1="94%" x2="88%" y2="9%">
      <stop stop-color="#1e4cb1"/>
      <stop offset="1" stop-color="#6797f4"/>
    </linearGradient>
    <mask id="cloud-reveal" x="0" y="0" width="520" height="360" maskUnits="userSpaceOnUse">
      <rect class="reveal" width="520" height="360" fill="#fff"/>
    </mask>
  </defs>
  <circle class="field" cx="260" cy="180" r="115" fill-opacity=".63"/>
  <circle class="orbit track" cx="260" cy="180" r="136" stroke-width="1.25"/>
  <circle class="orbit track" cx="260" cy="180" r="162" stroke-width="1" stroke-dasharray="1 6"/>
  <circle class="orbit arc inner" cx="260" cy="180" r="136" pathLength="100" stroke-width="2.5" stroke-dasharray="12 88"/>
  <circle class="orbit arc outer" cx="260" cy="180" r="162" pathLength="100" stroke-width="1.8" stroke-dasharray="7 93"/>
  <g class="mark">
    <use class="base" href="#cloud" transform="translate(153 106) scale(.27)"/>
    <g mask="url(#cloud-reveal)">
      <use class="color" href="#cloud" transform="translate(153 106) scale(.27)"/>
    </g>
  </g>
</svg>
