# XcodeGen spec. Regenerate the project after editing: `xcodegen generate`
name: NoNeedCloud
options:
  bundleIdPrefix: com.noneedcloud
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  NoNeedCloudCore:
    path: Packages/NoNeedCloudCore
targets:
  NoNeedCloud:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: App
        excludes:
          - "Resources/AppIcon.icon"
      # Icon Composer file; Xcode compiles it into the app icon (AppIcon).
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: NoNeedCloudCore
    settings:
      base:
        PRODUCT_NAME: NoNeedCloud
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NoNeedCloud
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "NoNeedCloud reads your Photos library to keep a full-quality backup copy on storage you own. Nothing in iCloud is changed."
        CODE_SIGN_ENTITLEMENTS: App/NoNeedCloud.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
schemes:
  NoNeedCloud:
    build:
      targets:
        NoNeedCloud: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NoNeedCloudCore/NoNeedCloudCoreTests
